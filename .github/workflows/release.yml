name: release

# Release to PyPI via Trusted Publishing (GitHub OIDC), no API token.
#
# The PyPI pending publisher was configured by DeVaris on 2026-08-03
# (project `conduit-connector-sdk`, owner ConduitIO, repo
# conduit-connector-sdk-python, workflow release.yml, no environment).
#
# NOT YET GA: v0.20 WS2's GA bar is the acceptance suite green in CI plus a
# first tagged release. The batching and Avro/schema middleware that bar also
# names are NOT implemented yet (no middleware module exists in src/), so
# tagging now would publish a package that does not meet its own stated scope.
# Publishing is wired here so the tag is the only remaining step once it does.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Required for Trusted Publishing: mints the OIDC token PyPI verifies
      # instead of a long-lived API token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Tag pushes only -- workflow_dispatch stays a build+check dry run.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
