name: release

# Release to PyPI via Trusted Publishing (GitHub OIDC), no API token.
#
# NOTE (distribution rename): the merged distribution is published as
# `conduitio` (see pyproject.toml and README). A NEW PyPI pending publisher
# must be configured -- project `conduitio`, owner ConduitIO, repo
# conduit-connector-sdk-python, workflow release.yml, no environment -- before
# the first tag push. The old `conduit-connector-sdk` / `conduit-client`
# publishers do not match the new name. The `conduitio` name itself is
# reserved by .github/workflows/reserve-conduitio.yml (issue #5).
#
# NOT YET GA: the GA bar is the acceptance suite green in CI plus a first
# tagged release for each namespace. Publishing is wired here so the tag is
# the only remaining step once that bar is met.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Required for Trusted Publishing: mints the OIDC token PyPI verifies
      # instead of a long-lived API token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Tag pushes only -- workflow_dispatch stays a build+check dry run.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
