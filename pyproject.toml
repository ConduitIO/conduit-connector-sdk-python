[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The distribution name is `conduitio` (the `conduit` PyPI name was not
# available; `conduitio` is reserved via .github/workflows/reserve-conduitio.yml,
# issue #5). The import package is `conduit`, a PEP 420 namespace exposing
# `conduit.connector` and `conduit.client` -- see
# docs/design/20261016-python-ga-merged-distribution.md.
name = "conduitio"
# NOTE: version is a placeholder until the first tagged release; the release
# workflow will drive this from git tags. Both namespaces share this one
# semantic version.
version = "0.1.0.dev0"
description = "Conduit for Python: the connector SDK (conduit.connector) and the gRPC control client (conduit.client) in one distribution."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Conduit contributors" }]
keywords = ["conduit", "connector", "client", "sdk", "cdc", "grpc", "etl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "grpcio>=1.75,<2",
    "protobuf>=6.31,<8",
    # conduit.connector: pydantic-based config with automatic parameter
    # introspection (BaseConfig/Field/to_parameters).
    "pydantic>=2.7,<3",
    # conduit.connector: grpc.health.v1 (SERVING/NOT_SERVING for the
    # "plugin" service go-plugin's client probes) -- not hand-rolled, per
    # the Lane B build task and CLAUDE.md. Runtime, not dev-only:
    # `conduit.connector.serve` registers this health servicer on every
    # plugin process.
    "grpcio-health-checking>=1.75,<2",
    # conduit.connector: `conduit-connector-sdk build` parses PEP 508
    # requirement strings and normalizes distribution names when vendoring a
    # connector's dependencies.
    "packaging>=23,<26",
    # conduit.client: decodes the rich google.rpc.Status/ErrorInfo detail
    # Conduit's server attaches to every ConduitError crossing the gRPC
    # boundary (conduit.client.errors).
    "grpcio-status>=1.75,<2",
    # conduit.client: google.rpc.error_details_pb2 (ErrorInfo), imported by
    # name (not just relied on as a transitive dep of grpcio-status).
    "googleapis-common-protos>=1.65,<2",
    # conduit.client: cross-platform user cache dir for the provisioned
    # `conduit` binary (conduit.client.local's download-on-first-use path).
    "platformdirs>=4,<5",
]

[project.scripts]
# `build` packages a connector project into a self-contained,
# directly-executable artifact -- see conduit/connector/_build.py's module
# docstring for why this is required (not just convenient) for Conduit to
# launch a standalone connector (design doc §1.1.6: Conduit execs with a
# clean environment, no inherited PATH).
conduit-connector-sdk = "conduit.connector._cli:main"

[project.urls]
Homepage = "https://github.com/ConduitIO/conduit-connector-sdk-python"
Repository = "https://github.com/ConduitIO/conduit-connector-sdk-python"
Issues = "https://github.com/ConduitIO/conduit-connector-sdk-python/issues"

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.75,<2",
    "ruff>=0.14,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "hypothesis>=6.120,<7",
    "grpc-stubs>=1.24,<2",
    # Type stubs for google.protobuf (e.g. empty_pb2.Empty in
    # conduit/connector/serve.py and _grpc/_controller.py).
    "types-protobuf>=6.30,<7",
    # Bounds the hung-event-loop watchdog test and the deterministic-shutdown
    # test so a regression that makes either hang fails CI promptly.
    "pytest-timeout>=2.3,<3",
    # Only used by the example connector (examples/http-poll-source/main.py)
    # and its acceptance test -- not a runtime dependency of the package.
    "httpx>=0.27,<1",
]

# Avro schema support (`conduit.connector.schema`) -- not a core runtime
# dependency, since most connectors never touch Avro. `fastavro` exposes
# `schemaless_writer`/`schemaless_reader`: plain, headerless Avro binary
# encoding matching exactly what conduit-commons' schema/avro package produces
# on the wire -- see `conduit/connector/schema.py`'s module docstring.
avro = ["fastavro>=1.9,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/conduit"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

# --- ruff -------------------------------------------------------------------
# Single tool for lint + format, replacing black/isort/flake8.
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]
# Generated protobuf/grpc stubs (buf generate output, see tools/generate-stubs.sh)
# are vendored, not hand-written -- excluded from both lint and format.
extend-exclude = [
    "src/conduit/_grpc/**/*_pb2.py",
    "src/conduit/_grpc/**/*_pb2_grpc.py",
    "src/conduit/_grpc/**/*.pyi",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "ASYNC", # async-specific lint (flags blocking calls in async def)
    "D",   # pydocstyle (docstring coverage on the public API surface)
    "RUF", # ruff-specific
]
ignore = [
    "D203", # conflicts with D211 (no-blank-line-before-class)
    "D213", # conflicts with D212 (multi-line-summary-first-line)
]

[tool.ruff.lint.per-file-ignores]
# Generated protobuf/grpc stubs are vendored output, not hand-written code.
"src/conduit/_grpc/**/*_pb2.py" = ["ALL"]
"src/conduit/_grpc/**/*_pb2_grpc.py" = ["ALL"]
"src/conduit/_grpc/**/*.pyi" = ["ALL"]
"tests/**" = ["D"]
"examples/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# `connector`/`api`/`config`/`opencdc`/`google`/`protoc_gen_openapiv2` are the
# generated gRPC/protobuf stubs' top-level package names -- reachable only
# because `conduit._grpc`'s own `__init__.py` prepends its directory to
# `sys.path` at import time. Treating these as known-first-party groups them
# with `conduit` imports so `ruff check --fix`/`ruff format` stay idempotent
# against the sys.path side-effect ordering this code depends on.
known-first-party = ["conduit", "api", "config", "connector", "opencdc"]

[tool.ruff.format]
quote-style = "double"

# --- mypy --------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
packages = ["conduit"]
# `src/conduit/_grpc` is also on mypy_path (not just `src`): protoc's Python
# codegen emits *absolute* imports rooted at each .proto file's own package
# path (e.g. `from connector.v2 import source_pb2`, `from api.v1 import
# api_pb2`), not imports nested under `conduit._grpc` -- see
# `src/conduit/_grpc/__init__.py`'s docstring. mypy has no equivalent of the
# runtime sys.path mutation that module performs, so it needs the same
# directory on `mypy_path` statically.
mypy_path = ["src", "src/conduit/_grpc"]
exclude = [
    "src/conduit/_grpc/.*_pb2.*",
    # These subtrees are reached exclusively via the top-level
    # `connector`/`api`/`config`/`opencdc`/`google`/`protoc_gen_openapiv2`
    # names (the second `mypy_path` entry above) -- excluding them here too
    # stops mypy's `packages` walk from also discovering them under
    # `conduit._grpc.*`, which would otherwise collide ("Source file found
    # twice under different module names").
    "^src/conduit/_grpc/connector/",
    "^src/conduit/_grpc/api/",
    "^src/conduit/_grpc/config/",
    "^src/conduit/_grpc/opencdc/",
    "^src/conduit/_grpc/google/",
    "^src/conduit/_grpc/protoc_gen_openapiv2/",
]

[[tool.mypy.overrides]]
# Generated stubs are not held to strict mode; they're vendored, regenerated
# output. The `connector.*`/`api.*`/`config.*`/`opencdc.*`/`google.api.*`/
# `protoc_gen_openapiv2.*` names are the same generated stubs, reached via the
# absolute-import top-level names protoc emits rather than through
# `conduit._grpc.*`.
module = [
    "conduit._grpc.*",
    "connector.*",
    "api.*",
    "config.*",
    "opencdc.*",
    "google.api.*",
    "protoc_gen_openapiv2.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
# googleapis-common-protos ships .pyi files for google.rpc.* but no py.typed
# marker, so mypy treats it as untyped by default even though real stubs
# exist on disk; same for grpc_status (grpcio-status), which ships no stubs
# at all. Both are third-party, not vendored by this repo.
module = ["google.rpc.*", "grpc_status.*"]
ignore_missing_imports = true

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real `conduit` binary (network download or PATH); skipped by default in sandboxed/offline runs",
]
# A generous global ceiling so a genuine regression that hangs a test (e.g.
# the hung-event-loop watchdog silently failing to fire) fails CI with a
# clear timeout instead of hanging the whole run indefinitely.
timeout = 60
